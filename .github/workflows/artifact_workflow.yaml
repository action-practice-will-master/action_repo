name : artifact workflow
on : push

jobs :
  make_artifact :
    runs-on : ubuntu-latest
    steps:
      - name : make text file
        run : echo Hi > hi.txt
      - name : make artifact
        uses : actions/upload-artifact@v4
        with :
          name : text_artifact
          path : ./hi.txt

  read_artifact : 
    runs-on : ubuntu-latest
    needs : [make_artifact]
    steps :
      - name : read artifact
        uses : actions/download-artifact@v4
        with : 
          name : text_artifact
          path : ./
      - name : read text file
        run : cat ./hi.txt

